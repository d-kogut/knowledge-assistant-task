[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Asystent odpowiadający na pytania o SpaceHub na podstawie dokumentacji (Qdrant + PolDense + Claude)."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "markdown-it-py>=4.3.0",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "simplemma>=2.0.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb"

# torch w kontenerze (Linux): tylko CPU, bez ~3 GB pakietów NVIDIA/CUDA.
# Na macOS zostaje paczka z PyPI (z obsługą Metal/MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = [
    "S101",   # assert w testach
    "RUF001", # polskie znaki i typograficzne myślniki w tekstach są zamierzone
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["simplemma.*", "sentence_transformers.*", "watchfiles.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: prawdziwy Qdrant w tymczasowym kontenerze (bez Dockera pomijane)",
    "e2e: działający stack z docker compose (KB_E2E_API_URL, np. po make up)",
]
